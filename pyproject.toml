[project]
name = "ceblpy"
version = "1.0.0"
description = "Load Canadian Elite Basketball League schedules, box scores, and play-by-play as pandas DataFrames."
authors = [
    { name = "Ryan Du" },
    { name = "David Awosoga" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.3.0",
    "pyarrow>=16.0.0",
    "requests>=2.32.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ceblpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.16.5",
]
docs = [
    "markdown-exec[ansi]>=1.12.3",
    "matplotlib>=3.11.1",
    "mkdocstrings-python>=2.0.8",
    "mplbasketball>=1.0.1",
    "tabulate>=0.10.0",
    "zensical>=0.0.58",
]
