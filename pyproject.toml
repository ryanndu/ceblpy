[project]
name = "ceblpy"
version = "0.1.1"
description = "Load Canadian Elite Basketball League schedules, box scores, and play-by-play as pandas DataFrames."
authors = [
    { name = "Ryan Du" },
    { name = "David Awosoga" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ceblpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.16.5",
]