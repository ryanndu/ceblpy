name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        floors: [false]
        include:
          - python-version: "3.11"
            floors: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - if: matrix.floors
        run: |
          uv pip install pandas==2.3.0 pyarrow==16.0.0 requests==2.32.2
          uv run --no-sync python -c "import pandas, pyarrow, requests; print(pandas.__version__, pyarrow.__version__, requests.__version__)"
      - run: uv run --no-sync pytest